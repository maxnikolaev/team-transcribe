# ============================================================
#  Team Transcribe — проекты и доступы (ПРИМЕР)
#  Скопируй этот файл в `config/projects.yaml` и заполни своими данными.
#  `config/projects.yaml` НЕ коммитится (добавлен в .gitignore).
# ============================================================

# --- Кто может обращаться к боту (Telegram user id) ---
# Свой id можно узнать у @userinfobot.
allowed_users:
  - tg_id: 123456789
    name: Иван
    role: owner
  - tg_id: 987654321
    name: Пётр
    role: member

# --- Проекты. folder — путь внутри целевого git-репозитория ---
# language перекрывает DEEPGRAM_LANGUAGE из .env для этого проекта.
# notify_chat — chat_id чата, куда слать уведомление (опционально).
projects:
  - id: project-a
    name: Проект А
    folder: "cases/2026-01-01 - проект-а/"
    language: ru
    members:
      - tg_id: 123456789
        role: owner
        can_create_folders: true
      - tg_id: 987654321
        role: member
        can_create_folders: false
    # notify_chat: -1001234567890
